name: scalar-robin
on:
  push:
    branches: ['feature/scalar-robin-surface-reaction*']
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        suite: [robin, regression]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ghcr.io/kmturbulenz/gnu-ompi-image:date-20260203
      options: '--shm-size=2gb'
    steps:
      - uses: actions/checkout@v4
      - name: Build with runtime checks
        shell: bash
        run: |
          source /opt/bashrc || true
          cmake -S . -B build -GNinja --preset=gnu-debug -DMGLET_REAL64=ON
          cmake --build build -j2
      - name: Robin tests
        if: matrix.suite == 'robin'
        shell: bash
        env:
          OMPI_ALLOW_RUN_AS_ROOT: '1'
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: '1'
        run: |
          source /opt/bashrc || true
          ctest --test-dir build/tests -R ScalarRobin --verbose
      - name: Existing regression tests
        if: matrix.suite == 'regression'
        shell: bash
        env:
          OMPI_ALLOW_RUN_AS_ROOT: '1'
          OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: '1'
        run: |
          source /opt/bashrc || true
          ctest --test-dir build/tests -R 'HotAndColdSpheres|Parker_micro|ScalarDecay' --output-on-failure --timeout 180
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.suite }}
          path: |
            build/tests/Testing/Temporary/LastTest.log
            build/tests/ScalarRobin/runs/*/solver.log
            build/tests/ScalarRobin/runs/*/validation.json
            build/tests/ScalarRobin/runs/*-validation.json
